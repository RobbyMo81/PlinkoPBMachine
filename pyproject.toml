[project]
name = "plinko-pb-machine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["tzdata==2025.3"]

[dependency-groups]
dev = ["pytest==8.3.2", "ruff==0.16.0", "black==26.5.1"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
